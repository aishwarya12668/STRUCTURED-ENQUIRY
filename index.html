<!DOCTYPE html>
<html>
<head>
    <title>Marks Portal Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="hero">
    <h1>Internal Assessment Portal</h1>
    <p>Student & Faculty Login</p>
</div>
<div class="login-container">
    <div class="login-card">
        <h2>Login</h2>
        <select id="role">
            <option value="student">
                Student
            </option>
            <option value="faculty">
                Faculty
            </option>
        </select>
        <input type="text" id="username" placeholder="Enter Username / USN">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">
            Login
        </button>
        <p id="msg"></p>
        <div class="register-links">
            <a href="/registerFaculty">
                Faculty Register
            </a>
        </div>
    </div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
