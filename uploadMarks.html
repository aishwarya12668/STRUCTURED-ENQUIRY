<!DOCTYPE html>
<html>
<head>
    <title>Upload Marks</title>
    <link rel="stylesheet" href="/css/style.css">

</head>
<body>

<div class="navbar">
    <button
    class="nav-btn"
    onclick="window.location.href='/faculty'">
        ← Back
    </button>

    <h2>Upload Marks</h2>

    <button
    class="logout-btn"
    onclick="logout()">

        Logout

    </button>

</div>

<div class="form-card">

    <h2>Enter Student Marks</h2>

    <input type="number" id="sid" placeholder="Student ID">

    <!-- SUBJECT 1 -->

    <select id="sub1">

        <option value="">
            Select Subject 1
        </option>

        <option value="Java">
            Java
        </option>

        <option value="DBMS">
            DBMS
        </option>

        <option value="DS">
            DS
        </option>

    </select>
    <input type="number" id="s1ia1" placeholder="IA1">
   <input type="number" id="s1ia2" placeholder="IA2">
    <hr>

    <select id="sub2">

        <option value="">
            Select Subject 2
        </option>

        <option value="Java">
            Java
        </option>

        <option value="DBMS">
            DBMS
        </option>

        <option value="DS">
            DS
        </option>
    </select>

    <input type="number" id="s2ia1" placeholder="IA1">
    <input type="number" id="s2ia2"  placeholder="IA2">

    <hr>

    <!-- SUBJECT 3 -->

    <select id="sub3">

        <option value="">
            Select Subject 3
        </option>

        <option value="Java">
            Java
        </option>

        <option value="DBMS">
            DBMS
        </option>

        <option value="DS">
            DS
        </option>

    </select>
    <input type="number" id="s3ia1" placeholder="IA1">
    <input type="number" id="s3ia2" placeholder="IA2">

    <button onclick="saveMarks()">

        Save Marks

    </button>

</div>

<script src="/js/uploadMarks.js"></script>

</body>

</html>
